name = "sirbon-dev"
main = "worker/index.ts"
compatibility_date = "2026-11-21"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sirbon"
# Required by `wrangler deploy` on Cloudflare Workers so the `DB` binding is preserved.
database_id = "b0068a09-76b4-4779-8adc-d9cc22d1b754"
